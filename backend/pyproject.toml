[project]
name = "smart-campus-backend"
version = "1.0.0"
description = "Smart Campus Service Platform - Backend API"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI Depends()/Query() in defaults

[tool.ruff.lint.per-file-ignores]
"app/models/*.py" = ["F821"]  # string forward references between models

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
