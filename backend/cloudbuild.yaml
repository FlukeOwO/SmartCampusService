# =============================================================================
# Google Cloud Build Configuration
# Automated Build and Deploy to Cloud Run
# =============================================================================

steps:
  # Step 1: Build Docker Image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--target=production'
      - '-t'
      - 'gcr.io/$PROJECT_ID/campus-backend:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/campus-backend:latest'
      - '.'
    dir: 'backend'

  # Step 2: Push Image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/campus-backend:$COMMIT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/campus-backend:latest'

  # Step 3: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'campus-backend'
      - '--image=gcr.io/$PROJECT_ID/campus-backend:$COMMIT_SHA'
      - '--region=asia-southeast1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=10'
      - '--set-env-vars=ENVIRONMENT=production,STORAGE_PROVIDER=gcs'
      - '--set-secrets=SECRET_KEY=jwt-secret-key:latest,POSTGRES_PASSWORD=db-password:latest'
      - '--vpc-connector=campus-vpc-connector'
      - '--service-account=campus-backend-sa@$PROJECT_ID.iam.gserviceaccount.com'

# Images to be pushed to Container Registry
images:
  - 'gcr.io/$PROJECT_ID/campus-backend:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/campus-backend:latest'

# Build options
options:
  machineType: 'N1_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY

# Timeout
timeout: '1200s'

# Substitutions (can be overridden)
substitutions:
  _REGION: 'asia-southeast1'
  _SERVICE_NAME: 'campus-backend'

# =============================================================================
# Setup Instructions:
# =============================================================================
# 1. Enable required APIs:
#    gcloud services enable cloudbuild.googleapis.com
#    gcloud services enable run.googleapis.com
#    gcloud services enable containerregistry.googleapis.com
#
# 2. Create secrets in Secret Manager:
#    echo -n "your-secret-key" | gcloud secrets create jwt-secret-key --data-file=-
#    echo -n "your-db-password" | gcloud secrets create db-password --data-file=-
#
# 3. Grant permissions to Cloud Build service account:
#    PROJECT_NUMBER=$(gcloud projects describe $PROJECT_ID --format='value(projectNumber)')
#    gcloud projects add-iam-policy-binding $PROJECT_ID \
#      --member=serviceAccount:${PROJECT_NUMBER}@cloudbuild.gserviceaccount.com \
#      --role=roles/run.admin
#
# 4. Create Cloud SQL instance and VPC connector
#
# 5. Trigger build manually:
#    gcloud builds submit --config=backend/cloudbuild.yaml
#
# 6. Set up Cloud Build trigger for automatic deployment:
#    - Connect repository (GitHub/GitLab/Bitbucket)
#    - Create trigger on push to main branch
#    - Point to backend/cloudbuild.yaml
# =============================================================================
