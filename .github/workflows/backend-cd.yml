# Deploy backend ไป Cloud Run
#   push dev  -> GitHub Environment "dev"  -> campus-api-dev
#   push main -> GitHub Environment "prod" -> campus-api
name: backend-cd

on:
  push:
    branches: [main, dev]
    paths: ["backend/**", ".github/workflows/backend-cd.yml"]
  workflow_dispatch:
    inputs:
      traffic_percent:
        description: "Traffic to the new revision (100 = full rollout, e.g. 10 = canary)"
        required: false
        default: "100"

permissions:
  contents: read
  id-token: write

concurrency:
  group: backend-cd-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-retries 10
    env:
      ENVIRONMENT: test
      SECRET_KEY: ci-only-secret-key-that-is-at-least-32-chars
      POSTGRES_SERVER: localhost
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Run migrations and tests
        run: |
          alembic upgrade head
          pytest -q

  deploy:
    needs: test
    if: ${{ success() && vars.DEPLOY_ENABLED == 'true' && (github.ref_name == 'main' || github.ref_name == 'dev') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    env:
      REGION: ${{ vars.GCP_REGION }}
      SERVICE: ${{ vars.SERVICE_NAME }}
      MIGRATE_JOB: ${{ vars.MIGRATE_JOB }}
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/campus/api:${{ github.sha }}
    steps:
      - uses: actions/checkout@v7

      - name: Authenticate to Google Cloud (WIF, no JSON key)
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}

      - name: Configure gcloud
        run: |
          gcloud config set project "${{ vars.GCP_PROJECT_ID }}"
          gcloud config set run/region "$REGION"
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet

      - name: Build and push image
        run: |
          docker build --target production -t "$IMAGE" backend
          docker push "$IMAGE"

      - name: Run database migration (Cloud Run Job)
        run: |
          gcloud run jobs update "$MIGRATE_JOB" --image "$IMAGE"
          gcloud run jobs execute "$MIGRATE_JOB" --wait

      - name: Check if service exists
        id: check
        run: |
          if gcloud run services describe "$SERVICE" --region "$REGION" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Service exists → deploy with --no-traffic + tag"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Service not found → bootstrap deploy (100% traffic)"
          fi

      - name: Deploy new revision
        id: deploy
        run: |
          TAG="sha-${GITHUB_SHA::7}"
          EXTRA_FLAGS=""
          if [ "${{ steps.check.outputs.exists }}" = "true" ]; then
            EXTRA_FLAGS="--no-traffic --tag $TAG"
          fi

          gcloud run deploy "$SERVICE" \
            --image "$IMAGE" \
            --quiet \
            --concurrency=20 \
            --startup-probe="httpGet.path=/healthz,initialDelaySeconds=0,timeoutSeconds=4,periodSeconds=5,failureThreshold=12" \
            $EXTRA_FLAGS

          REVISION=$(gcloud run services describe "$SERVICE" --format='value(status.latestCreatedRevisionName)')
          SERVICE_URL=$(gcloud run services describe "$SERVICE" --format='value(status.url)')

          if [ "${{ steps.check.outputs.exists }}" = "true" ]; then
            TAG_URL="${SERVICE_URL/https:\/\//https://$TAG---}"
          else
            TAG_URL="$SERVICE_URL"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"
          echo "test_url=$TAG_URL" >> "$GITHUB_OUTPUT"
          echo "service_url=$SERVICE_URL" >> "$GITHUB_OUTPUT"

      - name: Smoke test (/readyz)
        run: |
          url="${{ steps.deploy.outputs.test_url }}/readyz"
          echo "Testing $url"
          for i in 1 2 3 4 5 6 7 8; do
            code=$(curl -sS -o /tmp/readyz.json -w '%{http_code}' --max-time 15 "$url" || echo 000)
            if [ "$code" = "200" ] && grep -q '"ready"' /tmp/readyz.json; then
              echo "Smoke test passed"
              cat /tmp/readyz.json
              exit 0
            fi
            echo "Attempt $i failed (HTTP $code)"
            cat /tmp/readyz.json 2>/dev/null || true
            sleep 5
          done
          echo "::error::Smoke test /readyz failed"
          exit 1

      - name: Shift traffic to new revision
        if: steps.check.outputs.exists == 'true'
        env:
          PERCENT: ${{ inputs.traffic_percent || '100' }}
        run: |
          case "$PERCENT" in ''|*[!0-9]*) echo "::error::traffic_percent must be 1-100"; exit 1 ;; esac
          if [ "$PERCENT" -lt 1 ] || [ "$PERCENT" -gt 100 ]; then
            echo "::error::traffic_percent must be 1-100"; exit 1
          fi
          gcloud run services update-traffic "$SERVICE" \
            --to-revisions "${{ steps.deploy.outputs.revision }}=$PERCENT"

      - name: Remove deployment tag
        if: always() && steps.check.outputs.exists == 'true' && steps.deploy.outputs.tag != ''
        run: |
          gcloud run services update-traffic "$SERVICE" \
            --remove-tags "${{ steps.deploy.outputs.tag }}" || true

      - name: Summary
        run: |
          {
            echo "### Deployed ${{ steps.deploy.outputs.revision }}"
            echo "- Image: \`$IMAGE\`"
            echo "- URL: ${{ steps.deploy.outputs.service_url }}"
            echo "- Mode: ${{ steps.check.outputs.exists == 'true' && 'update (no-traffic)' || 'bootstrap (new service)' }}"
          } >> "$GITHUB_STEP_SUMMARY"