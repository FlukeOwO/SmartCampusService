name: backend-cd

on:
  push:
    branches: [main, dev]
    paths: ["backend/**", ".github/workflows/backend-cd.yml"]
  workflow_dispatch:
    inputs:
      traffic_percent:
        description: "Traffic to the new revision (100 = full rollout, e.g. 10 = canary)"
        required: false
        default: "100"

permissions:
  contents: read
  id-token: write

concurrency:
  group: backend-cd-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-retries 10
    env:
      ENVIRONMENT: test
      SECRET_KEY: ci-only-secret-key-that-is-at-least-32-chars
      POSTGRES_SERVER: localhost
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run migrations and tests
        run: |
          alembic upgrade head
          pytest -q

  deploy:
    needs: test
    if: vars.DEPLOY_ENABLED == 'true' && (github.ref_name == 'main' || github.ref_name == 'dev')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    env:
      REGION: ${{ vars.GCP_REGION }}
      SERVICE: ${{ vars.SERVICE_NAME }}
      MIGRATE_JOB: ${{ vars.MIGRATE_JOB }}
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/campus/api:${{ github.sha }}
    steps:
      - uses: actions/checkout@v7

      - name: Authenticate to Google Cloud (WIF, no JSON key)
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}

      - name: Configure gcloud
        run: |
          gcloud config set project "${{ vars.GCP_PROJECT_ID }}"
          gcloud config set run/region "$REGION"
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet

      - name: Build and push image
        run: |
          docker build --target production -t "$IMAGE" backend
          docker push "$IMAGE"

      - name: Run database migration (Cloud Run Job)
        run: |
          gcloud run jobs update "$MIGRATE_JOB" --image "$IMAGE"
          gcloud run jobs execute "$MIGRATE_JOB" --wait

      - name: Deploy new revision without traffic
        id: deploy
        run: |
          TAG="sha-${GITHUB_SHA::7}"
          gcloud run deploy "$SERVICE" --image "$IMAGE" --no-traffic --tag "$TAG" --quiet
          REVISION=$(gcloud run services describe "$SERVICE" --format='value(status.latestCreatedRevisionName)')
          SERVICE_URL=$(gcloud run services describe "$SERVICE" --format='value(status.url)')
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"
          echo "tag_url=${SERVICE_URL/https:\/\//https://$TAG---}" >> "$GITHUB_OUTPUT"
          echo "service_url=$SERVICE_URL" >> "$GITHUB_OUTPUT"

      - name: Smoke test new revision
        run: |
          for i in 1 2 3 4 5; do
            if curl -fsS --max-time 10 "${{ steps.deploy.outputs.tag_url }}/readyz"; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::Smoke test failed - traffic stays on the previous revision"
          exit 1

      - name: Shift traffic to new revision
        env:
          PERCENT: ${{ inputs.traffic_percent || '100' }}
        run: |
          case "$PERCENT" in ''|*[!0-9]*) echo "::error::traffic_percent must be 1-100"; exit 1 ;; esac
          if [ "$PERCENT" -lt 1 ] || [ "$PERCENT" -gt 100 ]; then
            echo "::error::traffic_percent must be 1-100"; exit 1
          fi
          gcloud run services update-traffic "$SERVICE" \
            --to-revisions "${{ steps.deploy.outputs.revision }}=$PERCENT"

      - name: Remove deployment tag
        if: always() && steps.deploy.outputs.tag != ''
        run: |
          gcloud run services update-traffic "$SERVICE" \
            --remove-tags "${{ steps.deploy.outputs.tag }}" || true

      - name: Summary
        run: |
          {
            echo "### Deployed ${{ steps.deploy.outputs.revision }}"
            echo "- Image: \`$IMAGE\`"
            echo "- URL: ${{ steps.deploy.outputs.service_url }}"
            echo "- Rollback: \`gcloud run services update-traffic $SERVICE --region $REGION --to-revisions=<previous-revision>=100\`"
          } >> "$GITHUB_STEP_SUMMARY"
